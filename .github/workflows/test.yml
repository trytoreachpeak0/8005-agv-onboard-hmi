name: test

# Runs on the self-hosted runner win11-01-onboard-hmi, a session-0 service on win11-01 (factory server
# Hyper-V guest). This workspace does not use GitHub-hosted runners; see the workspace root CLAUDE.md.
#
# Headless is enough: no test in this repository opens a window, drives UI Automation or captures
# pixels (measured 2026-09-18). The three station-deadline countdown tests run a Dispatcher on their own
# STA thread and create no window. If a test ever needs the interactive desktop, it does not belong in
# this job -- it goes to an interactive runner under the machine-wide Global\W2G-InteractiveDesktop lock.
#
# `headless` matters: win11-01 also hosts an interactive runner, and a job that only asked for
# [self-hosted] could be taken by either.
on:
  push:
    branches: [w2g/fp-v2-impl]
  # A draft pull request runs nothing; marking it ready runs the one round a ticket is meant to need.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Per-slice ONBOARD_HMI_G2 evidence for a batch exit (8005-agv-onboard-hmi#295), so that step no
  # longer runs serially on the control laptop. Dispatched by hand:
  #   gh workflow run test.yml -R trytoreachpeak0/8005-agv-onboard-hmi --ref <branch> [-f slices=FP-IS-00,FP-IS-04] [-f protocol_ref=<tag or sha>]
  # One build, one dotnet format and one protocol G1 for every slice, then one filtered test run per
  # slice; each slice gets its own directory and gate-result.json, uploaded as g2-slice-evidence.
  # push and pull_request keep the one whole-solution run they always had.
  workflow_dispatch:
    inputs:
      slices:
        description: "all = every slice that selects a test here; otherwise comma-separated FP-IS-NN"
        required: false
        default: all
      protocol_ref:
        description: "Protocol tag or full SHA to check out; empty = what WireToGateProtocol.cs binds"
        required: false
        default: ""

# Never cancel a running job here. Cancelling one on a self-hosted runner also cancels the runner's
# broker long-poll; the backoff retries exhaust and the session wedges without self-healing. Measured on
# 2026-09-03: 4 hours 14 minutes of dead CI. This repository has exactly one runner, so a wedged session
# is its entire CI. A duplicate five-minute run is the cheaper outcome.
#
# event_name is in the group so a per-slice dispatch and a push to the same branch never share one:
# a third arrival in a group displaces the queued one, and these two are different runs, not repeats.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Skipped, not cancelled: GitHub decides this before any runner is involved.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, headless]
    # A backstop, not how a run ends: a normal run takes a few minutes, and a timeout ends the job by
    # cancelling it, which can wedge the runner the same way a manual cancel does. The per-slice run
    # does fifteen filtered test runs, most of them paying the outbound schema compilation again.
    # Measured on 2026-10-11, all fifteen slices (run 38101599940): job 19 min, of which preflight
    # 88 s, G1 11 s, build 5 s, format 40 s and the fifteen test runs 939 s (FP-IS-07 alone 256 s).
    # 60 minutes is three times that.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 60 || 30 }}
    env:
      # NuGet's vulnerability audit fetches from nuget.org during every restore, and with
      # TreatWarningsAsErrors a failed fetch (NU1900) is a red run that says nothing about the code.
      NuGetAudit: 'false'
      # The guest is zh-CN. English console output lets run-w2g-g2.ps1 summarise the test counts; the
      # verdict never depends on console text, only on exit codes.
      DOTNET_CLI_UI_LANGUAGE: en
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'

    steps:
      # Both repositories side by side, under the names run-w2g-g2.ps1 expects: it resolves the protocol
      # as ../8005-agv-protocol from this repository's root.
      - uses: actions/checkout@v7
        with:
          path: 8005-agv-onboard-hmi

      # The protocol release this branch binds, read from the contract rather than written here, so the
      # same workflow file serves a branch bound to another release without an edit. A released identity
      # (ApprovalStatus APPROVED_RELEASE) is checked out by its tag; a candidate's tag does not exist yet
      # (8005-agv-onboard-hmi#214: protocol-v3.0.0 is created by 8005-agv-program#152 only at release), so
      # a candidate is checked out by its Commit constant. The switch is the constant, not this file.
      - name: Protocol ref
        id: protocol
        shell: pwsh
        env:
          PROTOCOL_REF_INPUT: ${{ inputs.protocol_ref }}
        run: |
          $source = Get-Content -LiteralPath 8005-agv-onboard-hmi/src/SQCD.Agv.Contracts/WireToGateProtocol.cs -Raw
          function Get-Constant([string] $name) {
            $match = [regex]::Match($source, "public\s+const\s+string\s+$name\s*=\s*`"([^`"]+)`"\s*;")
            if (-not $match.Success) { throw "WireToGateProtocol.cs declares no $name constant." }
            $match.Groups[1].Value
          }
          $tag = Get-Constant 'Tag'
          $commit = Get-Constant 'Commit'
          $approval = Get-Constant 'ApprovalStatus'
          $ref = $approval -eq 'APPROVED_RELEASE' ? $tag : $commit
          # A dispatch may name another protocol ref; the gate script still checks that the bound
          # commit is an ancestor of it and that the tag, if present, points at the bound commit.
          if (-not [string]::IsNullOrWhiteSpace($env:PROTOCOL_REF_INPUT)) { $ref = $env:PROTOCOL_REF_INPUT.Trim() }
          Write-Output "Protocol: tag $tag, commit $commit, approval $approval -> checkout ref $ref"
          "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Full history and tags: the gate checks that the tag, if it exists, points at the bound commit, and
      # that the bound commit is an ancestor of HEAD. The protocol repository is public, so the default
      # token reads it.
      - uses: actions/checkout@v7
        with:
          repository: trytoreachpeak0/8005-agv-protocol
          ref: ${{ steps.protocol.outputs.ref }}
          path: 8005-agv-protocol
          fetch-depth: 0

      - name: dotnet --info
        shell: pwsh
        working-directory: 8005-agv-onboard-hmi
        run: dotnet --info

      # ONBOARD_HMI_G2 over the whole solution: Release build, every test, dotnet format, and the protocol
      # identity checks. -SkipProtocolG1 because the protocol's own CI ran G1 on the bound commit; running
      # it here would add node and pnpm to this runner for no new fact.
      #
      # The evidence goes to the runner's temp directory and is uploaded below; it is never committed.
      - name: ONBOARD_HMI_G2
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        working-directory: 8005-agv-onboard-hmi
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "g2-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "G2_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          pwsh -NoProfile -File scripts/run-w2g-g2.ps1 -SkipProtocolG1 -EvidenceRoot $evidenceRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ONBOARD_HMI_G2 per slice, the evidence a batch exit cites. Protocol G1 runs here, once: the
      # node and pnpm it needs are installed machine-wide on win11-01 (C:\Program Files\nodejs, node
      # v24.20.0 and pnpm 11.25.0 on 2026-10-11) for the protocol repository's own g1.yml, whose runner
      # runs as the same NETWORK SERVICE account as this one. Nothing here installs them; if they go
      # missing, run-w2g-g2.ps1 records G1 as NOT_RUN and every slice fails, which is the right noise.
      # The slice list goes through an environment variable, never into the script text.
      - name: ONBOARD_HMI_G2 per slice
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: 8005-agv-onboard-hmi
        env:
          G2_SLICES: ${{ inputs.slices }}
        run: |
          $evidenceRoot = Join-Path $env:RUNNER_TEMP "g2-slices-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          "G2_EVIDENCE_ROOT=$evidenceRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $slices = ($env:G2_SLICES ?? '').Trim()
          $sliceArguments = ($slices -eq '' -or $slices -eq 'all') ? @('-AllSlices') : @('-Slice', $slices)
          pwsh -NoProfile -File scripts/run-w2g-g2.ps1 -EvidenceRoot $evidenceRoot @sliceArguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: UI layout audit
        if: always()
        shell: pwsh
        working-directory: 8005-agv-onboard-hmi
        run: |
          pwsh -NoProfile -File scripts/check-ui-layout.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # continue-on-error, because this uploads diagnostics, not a deliverable: the verdict is the exit
      # codes of the steps above, already reached by the time this runs. A transient ECONNRESET from the
      # artifact service must not turn a green run red.
      - name: Upload G2 evidence
        if: always() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: g2-evidence
          path: |
            ${{ env.G2_EVIDENCE_ROOT }}
            8005-agv-onboard-hmi/evidence/audits/
          if-no-files-found: warn

      # The per-slice run's evidence: one directory per slice, each with its own gate-result.json,
      # plus protocol-v*/multi-slice/<run>/ with the shared steps' logs and multi-slice-summary.json.
      # One artifact rather than one per slice: upload-artifact cannot loop, and a batch exit downloads
      # all of them anyway. No retention-days, the same as g2-evidence above. This one is what a batch
      # exit cites, and continue-on-error still holds: a failed upload is a missing artifact, plain to
      # see, and the remedy is another dispatch, not a red verdict over slices that passed.
      - name: Upload per-slice G2 evidence
        if: always() && github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: g2-slice-evidence
          path: ${{ env.G2_EVIDENCE_ROOT }}
          if-no-files-found: warn
